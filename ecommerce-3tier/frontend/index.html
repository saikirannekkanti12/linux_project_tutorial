<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecommerce 3-Tier Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    h1 { color: #1f2937; }
    .product { padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Online Ecommerce (3-Tier Architecture)</h1>
  <p>Frontend (Nginx) → Backend (Node.js API) → Database (PostgreSQL)</p>
  <div id="products">Loading products...</div>

  <script>
    async function loadProducts() {
      try {
        const response = await fetch('http://localhost:5000/api/products');
        const products = await response.json();

        const container = document.getElementById('products');
        if (!Array.isArray(products) || products.length === 0) {
          container.innerHTML = '<p>No products found.</p>';
          return;
        }

        container.innerHTML = products
          .map(p => `<div class="product"><strong>${p.name}</strong><br/>$${Number(p.price).toFixed(2)}</div>`)
          .join('');
      } catch (error) {
        document.getElementById('products').innerHTML = `<p>Failed to load products: ${error.message}</p>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>
